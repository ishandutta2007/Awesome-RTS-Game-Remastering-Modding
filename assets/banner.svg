<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Dynamic floating particles and grid pulse */
    @keyframes gridPulse {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.25; }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pingWave {
      0% { r: 5px; opacity: 0.9; }
      100% { r: 70px; opacity: 0; }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    .grid-lines { animation: gridPulse 6s ease-in-out infinite; }
    .radar-arm { transform-origin: 1040px 180px; animation: radarScan 10s linear infinite; }
    .ping-circle { transform-origin: 1040px 180px; animation: pingWave 3s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .pill-1 { animation: pillFloat1 5s ease-in-out infinite; }
    .pill-2 { animation: pillFloat2 6s ease-in-out infinite; }
    .laser-beam { stroke-dasharray: 60, 140; animation: beamFlow 4s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)"/>

  <!-- Tactical RTS Grid Map Lines in Background -->
  <g class="grid-lines" stroke="#38bdf8" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>

    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Dynamic Circuit / Tactical Waypoint Lines (Background Layer) -->
  <path d="M 50 310 L 350 310 L 420 270 L 850 270 L 920 320 L 1150 320" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" class="laser-beam" opacity="0.6"/>
  <path d="M 80 50 L 260 50 L 320 80 L 780 80" fill="none" stroke="#38bdf8" stroke-width="1.5" class="laser-beam" opacity="0.4"/>

  <!-- Radar Tactical Display (Right Side Backdrop - dynamic) -->
  <g opacity="0.45">
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#1e293b" stroke-width="2"/>
    <circle cx="1040" cy="180" r="75" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="1040" cy="180" r="40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="930" y1="180" x2="1150" y2="180" stroke="#334155" stroke-width="1"/>
    <line x1="1040" y1="70" x2="1040" y2="290" stroke="#334155" stroke-width="1"/>
    <circle cx="1040" cy="180" class="ping-circle" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="1040" y1="180" x2="1110" y2="110" stroke="#38bdf8" stroke-width="2.5" class="radar-arm" filter="url(#glow)"/>
  </g>

  <!-- Ambient Glow Behind Text Content -->
  <circle cx="280" cy="180" r="220" fill="url(#accentGlow)" filter="url(#glow)"/>

  <!-- FOREGROUND CONTENT: Header & Meta (Crisp, High-Contrast & Always Clear) -->
  <g transform="translate(60, 48)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <text x="26" y="18" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">CURATED DEVELOPER DIRECTORY</text>

    <!-- Main Title (Gradient Fill + Drop Shadow) -->
    <text x="0" y="78" fill="url(#primaryGrad)" font-size="38" font-weight="900" letter-spacing="-0.5" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
      RTS Game Remastering &amp; Modding
    </text>

    <!-- Subtitle (Clear Foreground Text) -->
    <text x="0" y="112" fill="#94a3b8" font-size="16" font-weight="500" letter-spacing="0.2">
      Open-Source Reimplementations, Modern Source-Ports, Multiplayer Lobbies &amp; Tools
    </text>

    <!-- Descriptive Bullets / Pillars -->
    <text x="0" y="142" fill="#cbd5e1" font-size="13.5" font-weight="400">
      ⚡ Command &amp; Conquer • Age of Empires • StarCraft • Supreme Commander • Total Annihilation
    </text>
  </g>

  <!-- FOREGROUND DYNAMIC PILLS (Positioned bottom & right, will NOT obstruct text) -->
  <g class="pill-1" transform="translate(60, 240)">
    <!-- Pill 1: OpenRA & C&C -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))"/>
      <circle cx="22" cy="21" r="5" fill="#38bdf8" filter="url(#subtleGlow)"/>
      <text x="36" y="26" fill="#f8fafc" font-size="13" font-weight="700">OpenRA Engine</text>
    </g>

    <!-- Pill 2: Direct3D 11 / Vulkan -->
    <g transform="translate(195, 0)">
      <rect width="180" height="42" rx="10" fill="url(#badgeGrad)" stroke="#818cf8" stroke-opacity="0.7" stroke-width="1.2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))"/>
      <circle cx="22" cy="21" r="5" fill="#818cf8" filter="url(#subtleGlow)"/>
      <text x="36" y="26" fill="#f8fafc" font-size="13" font-weight="700">Direct3D 11 &amp; Vulkan</text>
    </g>

    <!-- Pill 3: Netplay & Matchmaking -->
    <g transform="translate(390, 0)">
      <rect width="185" height="42" rx="10" fill="url(#badgeGrad)" stroke="#c084fc" stroke-opacity="0.7" stroke-width="1.2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))"/>
      <circle cx="22" cy="21" r="5" fill="#c084fc" filter="url(#subtleGlow)"/>
      <text x="36" y="26" fill="#f8fafc" font-size="13" font-weight="700">Rollback &amp; Lobbies</text>
    </g>

    <!-- Pill 4: Spring / Recoil -->
    <g transform="translate(590, 0)">
      <rect width="170" height="42" rx="10" fill="url(#badgeGrad)" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))"/>
      <circle cx="22" cy="21" r="5" fill="#34d399" filter="url(#subtleGlow)"/>
      <text x="36" y="26" fill="#f8fafc" font-size="13" font-weight="700">Recoil Engine / BAR</text>
    </g>
  </g>

  <!-- Outer Neon Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="11" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.4"/>
</svg>
